services:
  skyscope:
    build: .
    container_name: skyscope-dashboard
    env_file:
      - .env
    ports:
      # Local-only by default. Do not make public without access controls.
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health',timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
